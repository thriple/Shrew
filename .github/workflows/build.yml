name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One-time fix for web uploads that lose folders: if Shrew.zip is in the repo,
      # replace everything (except .github) with the zip's folder layout and commit it.
      - name: Unpack Shrew.zip
        if: hashFiles('Shrew.zip') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          unzip -q Shrew.zip -d "$RUNNER_TEMP/unpack"
          rm -rf "$RUNNER_TEMP/unpack/Shrew/.github"
          git rm -rq -- . ':!.github'
          cp -a "$RUNNER_TEMP/unpack/Shrew/." .
          git add -A
          git commit -m "Unpack Shrew.zip into its folders"
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "shrew-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: shrew-apk
          path: shrew-*.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "build-${{ github.run_number }}" "shrew-${{ github.run_number }}.apk"
          --title "Shrew build ${{ github.run_number }}"
          --notes "Open this page on your phone, download the APK below and tap it to install."
          --latest
